version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            # Use a specific stable Node version
            - nvm install 22.22.2
            - nvm use 22.22.2
            - node -v
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        # Cache node_modules for faster builds
        paths:
          - node_modules/**/*